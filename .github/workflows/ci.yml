name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q --cov=app --cov-report=term-missing

  # Build-only validation on ordinary branch pushes/PRs — never pushed
  # anywhere. Skipped on tag pushes, where docker-release does the real
  # (pushed) build instead, so a tag push doesn't build the image twice.
  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: drytrix/seamdestress:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Versioned release build, triggered only by pushing a semver tag
  # (e.g. `git tag v1.2.3 && git push origin v1.2.3`) — publishes
  # drytrix/seamdestress to Docker Hub tagged with the full version,
  # major.minor, major, and `latest`. Requires the DOCKERHUB_USERNAME and
  # DOCKERHUB_TOKEN repository secrets (Settings > Secrets and variables >
  # Actions); DOCKERHUB_TOKEN should be a Docker Hub access token, not the
  # account password.
  docker-release:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: drytrix/seamdestress
          # latest=auto tags `latest` only for a stable (non-prerelease)
          # version, so a `v1.3.0-rc1` push never overwrites `latest`.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
